name: Release

# Manual trigger only — open the Actions tab on GitHub, pick this workflow,
# and click "Run workflow". The version is read from package.json via the
# __VERSION__ token, so bump that (and tauri.conf.json) on main before
# triggering. Each run produces a Draft release that you review and publish
# manually.
on:
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ''
            label: macos-arm64
          # Pinned to 22.04 (not ubuntu-latest) so the produced AppImage links
          # against an older glibc and runs on more user systems.
          - platform: ubuntu-22.04
            args: ''
            label: linux-x64
          - platform: windows-latest
            args: ''
            label: windows-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebView dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROCESSFOX_EDITION: community
        with:
          tagName: v__VERSION__
          releaseName: 'ProcessFox v__VERSION__'
          releaseBody: |
            ## Was ist neu

            <!-- Hier vor dem Veröffentlichen die Release-Notes ergänzen. -->

            ## Downloads

            - **macOS (Apple Silicon):** `.dmg`
            - **Windows:** `.msi` / `.exe`
            - **Linux:** `.AppImage` / `.deb`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
